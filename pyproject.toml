[project]
name = "verbatim"
version = "0.1.0"
description = "A citation-focused scientific literature research assistant"
readme = "README.md"
requires-python = ">=3.11"
# AGPL because PyMuPDF, which does the layout-aware PDF parsing, is dual
# licensed AGPL-3.0 or commercial. Importing it makes the combined work AGPL.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.141.1",
  "fastembed>=0.8.0",
  "mcp>=1.2.0",
  "pymupdf>=1.26.0",
  "pymupdf4llm>=1.28.2",
  "python-dotenv>=1.2.2",
  "sqlite-vec>=0.1.9",
]

[project.scripts]
verbatim = "verbatim.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["uv_build>=0.7.0,<0.8.0"]
build-backend = "uv_build"
