name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run the test suite
        # The suite is deliberately offline: every network and model call is
        # behind an injectable seam, so CI needs no arXiv, no Ollama and no
        # API key.
        run: uv run --frozen pytest -q

  retrieval-gate:
    # A measurement nothing enforces is a claim, not a guarantee. This scores
    # retrieval on every push and fails the build if it drops.
    #
    # It runs against the sample corpus committed to this repository, because
    # that is the only corpus a clean checkout has - the real one is 26 GB of
    # PDFs on one machine. Twelve questions over forty plainly distinct papers
    # is a coarse tripwire: it catches retrieval breaking, not retrieval
    # getting slightly worse. The honest numbers live in evals/heldout.jsonl,
    # which needs the full corpus and cannot run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/verbatim/models
          key: fastembed-${{ hashFiles('uv.lock') }}
      - name: Retrieval must not regress
        run: >
          uv run --frozen verbatim eval
          --cases evals/gate.jsonl
          --state sample/corpus.db
          --min-mrr 0.90
